{% set name = "sqltrie" %}
{% set version = "0.12.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/sqltrie-{{ version }}.tar.gz
  sha256: 5480decfe75a9f3260f43a52ca69b316122e507338658ad565c0c818aeb734e5

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools_scm >=6.3.1

  run:
    - python >={{ python_min }}
    - attrs
    - orjson
    - pygtrie

test:
  imports:
    - sqltrie
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/iterative/sqltrie
  summary: SQL-based prefix tree inspired by pygtrie and python-diskcache
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - pmrowla
    - shcheklein
